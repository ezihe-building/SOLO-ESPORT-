kind = "web"
previewPath = "/"
title = "SOLOS+ ESPORTZ"
version = "1.0.0"
id = "artifacts/solosplus"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19618

[services.development]
run = "pnpm --filter @workspace/solosplus run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solosplus", "run", "build" ]
publicDir = "artifacts/solosplus/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19618"
BASE_PATH = "/"
